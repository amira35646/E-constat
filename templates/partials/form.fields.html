{% if form.non_field_errors %}
  {% for erreur in form.non_field_errors %}<p class="erreur">{{ erreur }}</p>{% endfor %}
{% endif %}

{% for field in form %}
<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}
    {% for erreur in field.errors %}<p class="erreur">{{ erreur }}</p>{% endfor %}
</div>
{% endfor %}
